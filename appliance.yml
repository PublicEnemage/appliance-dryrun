# Appliance settings for Shelf.
# Filled at bootstrap (2026-10-01), approved by the Engineering Lead.

appliance_version: 0.1.0
floor_version: 0.1.0          # pinned Definition of Ready floor (docs/dor/floor.yml)

grade: light                  # light | standard | assured (approved by the Intent Owner, floor row C6)
# Shelf: light while the idea is tested with one library. Raise to standard before real
# members' personal data is stored in production. Proposed at bootstrap; the business
# case confirms it (floor row C6).

# Shelf: both human. With one principal and no independent review, the merge is the only
# human check on agent work. Revisit when check E1 ships.
autonomy:
  merge_to_main: human        # human | auto-on-green
  merge_to_lanes: human       # human | auto-on-green

# One person holds both the Intent Owner and Engineering Lead seats.
# When true, CLAUDE.md must carry the single-principal disclosure.
single_principal: true

caps:
  constitution_bytes: 16000   # CLAUDE.md size budget (design rule 8)
  state_lines: 200            # STATE.md line cap
  track_cap: 2                # parallel delivery tracks

# Shelf: template defaults kept. Neither folder exists yet; each is created by the first
# increment that needs it. If the chosen framework keeps migrations elsewhere, an ADR
# moves migrations_dir before the first migration merges.
data:
  contracts_dir: contracts        # one YAML file per exchange (STD-002, check E14)
  migrations_dir: migrations      # append-only migrations (STD-001, check E15)
